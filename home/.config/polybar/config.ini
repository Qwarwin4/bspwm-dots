include-file = colors.ini
include-file = modules.ini

[settings]
screenchange-reload = true
pseudo-transparency = false

[bar/main]
monitor = ${env:MONITOR:}
monitor-strict = false
width = 98%
height = 26
offset-x = 1%
offset-y = 6
radius = 0
fixed-center = true
bottom = false
wm-restack = bspwm
override-redirect = false
enable-ipc = true

background = ${colors.bg}
foreground = ${colors.fg}

border-top-size = 7
border-bottom-size = 7
border-color = ${colors.bg}

padding-left = 1
padding-right = 1
module-margin = 0
line-size = 3

cursor-click = pointer
cursor-scroll = ns-resize

font-0 = JetBrainsMono Nerd Font:style=Bold:pixelsize=13;3
font-1 = JetBrainsMono Nerd Font:pixelsize=20;4
font-2 = JetBrainsMono Nerd Font:style=Bold:pixelsize=15;3
font-3 = Noto Sans CJK JP:pixelsize=12;2
font-4 = Noto Color Emoji:scale=10;2

modules-left = ${env:BAR_LEFT:launcher sp cap-l bspwm cap-r}
modules-center = ${env:BAR_CENTER:temperature sp2 memory sp2 cpu}
modules-right = ${env:BAR_RIGHT:pulseaudio xkeyboard cap-l date cap-r sp powermenu}
