[module/sp]
type = custom/text
format = " "

[module/sp2]
type = custom/text
format = "   "

[module/cap-l]
type = custom/text
format = %{T2}%{T-}
format-foreground = ${colors.pill}

[module/cap-r]
type = custom/text
format = %{T2}%{T-}
format-foreground = ${colors.pill}

[module/launcher]
type = custom/text
format = %{T3}%{T-}
format-foreground = ${colors.blue}
format-padding = 1
click-left = kbd-latin; rofi -show drun &

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
inline-mode = true
enable-click = true
enable-scroll = true
reverse-scroll = false
occupied-scroll = false

format = <label-state>
format-background = ${colors.pill}

ws-icon-0 = 1;%{F#f9de8f}1
ws-icon-1 = 2;%{F#ff9b93}2
ws-icon-2 = 3;%{F#95e1d3}3
ws-icon-3 = 4;%{F#81a1c1}4
ws-icon-4 = 5;%{F#a3be8c}5
ws-icon-5 = 6;%{F#f9de8f}6
ws-icon-6 = 7;%{F#ff9b93}7
ws-icon-7 = 8;%{F#95e1d3}8
ws-icon-8 = 9;%{F#81a1c1}9
ws-icon-default = %{F#adb1b9}•

label-focused = %icon%
label-focused-background = ${colors.pill}
label-focused-underline = ${colors.dim}
label-focused-padding = 1

label-occupied = %icon%
label-occupied-background = ${colors.pill}
label-occupied-padding = 1

label-urgent = %icon%
label-urgent-background = ${colors.pill}
label-urgent-underline = ${colors.red}
label-urgent-padding = 1

label-empty = %icon%
label-empty-background = ${colors.pill}
label-empty-padding = 1

label-separator =

[module/temperature]
type = internal/temperature
interval = 3
thermal-zone = ${env:THERMAL_ZONE:0}
hwmon-path = ${env:HWMON_PATH:}
base-temperature = 30
warn-temperature = 80
units = true

format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.cyan}
format-warn = <label-warn>
format-warn-prefix = " "
format-warn-prefix-foreground = ${colors.red}
label = %temperature-c%
label-foreground = ${colors.cyan}
label-warn = %temperature-c%
label-warn-foreground = ${colors.red}

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = "󰍛 "
format-foreground = ${colors.orange}
label = %gb_used%

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = " "
format-foreground = ${colors.purple}
label = %percentage%%

[module/battery]
type = internal/battery
battery = ${env:BATTERY:BAT0}
adapter = ${env:ADAPTER:AC}
full-at = 99
low-at = 15
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
format-full-prefix = "  "
format-full-prefix-foreground = ${colors.green}
format-low = <animation-low> <label-low>
format-charging-padding = 1
format-discharging-padding = 1
format-full-padding = 1
format-low-padding = 1

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = 100%
label-low = %percentage%%

ramp-capacity-0 = " "
ramp-capacity-1 = " "
ramp-capacity-2 = " "
ramp-capacity-3 = " "
ramp-capacity-4 = " "
ramp-capacity-foreground = ${colors.green}

animation-charging-0 = " "
animation-charging-1 = " "
animation-charging-2 = " "
animation-charging-3 = " "
animation-charging-4 = " "
animation-charging-foreground = ${colors.pink}
animation-charging-framerate = 750

animation-low-0 = 󰂃
animation-low-1 = " "
animation-low-foreground = ${colors.red}
animation-low-framerate = 800

[module/backlight]
type = internal/backlight
card = ${env:BACKLIGHT_CARD:}
use-actual-brightness = true
enable-scroll = true
scroll-interval = 5
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.blue}
format-padding = 1
label = %percentage%%

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume> <label-volume>
format-volume-padding = 1
label-volume = %percentage%%
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.red}
format-muted = <label-muted>
format-muted-padding = 1
label-muted = 󰝟 mute
label-muted-foreground = ${colors.muted}
click-right = pavucontrol &

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
format = <label-layout><label-indicator>
label-layout = %layout%
label-layout-foreground = ${colors.white}
label-layout-padding = 1
label-indicator-on-capslock = " 󰘲 "
label-indicator-on-capslock-padding = 1
label-indicator-on-capslock-foreground = ${colors.yellow}
label-indicator-off-capslock =

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %a, %d %b %Y  %H:%M
format = <label>
format-prefix = "󰅐 "
format-prefix-foreground = ${colors.muted}
format-prefix-background = ${colors.pill}
label = %date%
label-foreground = #888e96
label-background = ${colors.pill}

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3
format-connected = <label-connected>
format-connected-padding = 1
label-connected = 
label-connected-foreground = ${colors.green}
format-disconnected = <label-disconnected>
format-disconnected-padding = 1
label-disconnected = 󰤮
label-disconnected-foreground = ${colors.red}
click-left = wifimenu &

[module/eth]
type = internal/network
interface-type = wired
interval = 3
format-connected = <label-connected>
format-connected-padding = 1
label-connected = 󰈀
label-connected-foreground = ${colors.green}
format-disconnected = <label-disconnected>
format-disconnected-padding = 1
label-disconnected = 󰈀
label-disconnected-foreground = ${colors.red}

[module/powermenu]
type = custom/text
format = 
format-foreground = ${colors.red}
format-padding = 1
click-left = kbd-latin; powermenu &

[module/tray]
type = internal/tray
tray-size = 60%
tray-spacing = 6px
tray-padding = 2px
format-padding = 1
