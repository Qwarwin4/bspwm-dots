backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
unredir-if-possible = true;

shadow = true;
shadow-radius = 15;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-opacity = 0.6;

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 8;

corner-radius = 8;

blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;

rules = (
    { match = "window_type = 'tooltip'"; fade = false; shadow = false; opacity = 0.95; full-shadow = false; },
    { match = "window_type = 'dock' || window_type = 'desktop'"; corner-radius = 0; blur-background = false; },
    { match = "window_type = 'dock'"; shadow = false; },
    { match = "window_type *= 'menu' || window_type = 'utility' || window_type = 'splash' || window_type = 'notification'"; shadow = false; blur-background = false; },
    { match = "window_type *= 'menu'"; corner-radius = 0; },
    { match = "fullscreen"; corner-radius = 0; },
    { match = "_GTK_FRAME_EXTENTS@"; shadow = false; blur-background = false; },
    { match = "class_g = 'Dunst'"; corner-radius = 8; opacity = 0.96; },
    { match = "class_g = 'Rofi'"; corner-radius = 10; },
    { match = "class_g *?= 'flameshot' || class_g *?= 'screenkey'"; shadow = false; blur-background = false; corner-radius = 0; },
);

animations = (
    {
        triggers = [ "open", "show" ];
        preset = "appear";
        duration = 0.18;
        scale = 0.92;
    },
    {
        triggers = [ "close", "hide" ];
        preset = "disappear";
        duration = 0.14;
        scale = 0.92;
    },
    {
        triggers = [ "geometry" ];
        preset = "geometry-change";
        duration = 0.2;
    },
);
